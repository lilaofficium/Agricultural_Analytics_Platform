name: Agriculture Data Platform CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Future build and test steps
      - name: Placeholder
        run: echo "Build and tests will run here."

  auto-merge-dev-to-main:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - name: Create Pull Request from dev to main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: dev
          title: "Auto-merge dev into main"
          body: |
            CI passed on the **dev** branch.
            This PR was created automatically by GitHub Actions.

          commit-message: "Create PR: dev → main"
